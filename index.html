        // ==========================================
        // APPLICATION STATE & CONTROLLER
        // ==========================================
        class HistoryQuizApp {
            constructor() {
                this.container = document.getElementById('app-container');
                this.storageKey = 'wbbse_class9_history_progress_v1';
                this.bookmarkKey = 'wbbse_class9_history_bookmarks_v1';
                
                this.progress = this.loadProgress();
                this.bookmarks = this.loadBookmarks();
                
                this.currentView = 'home';
                this.activeChapter = null;
                this.activeSet = null;
                this.currentQIndex = 0;
                this.userAnswers = [];
                this.markedForReview = [];
                this.instantFeedback = true; // Default helpful learning mode
                this.timerInterval = null;
                this.secondsRemaining = 1200; // 20 minutes
                this.timeSpent = 0;

                this.updateBookmarkBadge();
                this.renderHome();
            }

            // LocalStorage Helpers
            loadProgress() {
                try {
                    const saved = localStorage.getItem(this.storageKey);
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    return {};
                }
            }

            saveProgress() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.progress));
                } catch (e) {
                    console.error("Storage error", e);
                }
            }

            loadBookmarks() {
                try {
                    const saved = localStorage.getItem(this.bookmarkKey);
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            }

            saveBookmarks() {
                try {
                    localStorage.setItem(this.bookmarkKey, JSON.stringify(this.bookmarks));
                    this.updateBookmarkBadge();
                } catch (e) {
                    console.error("Bookmark storage error", e);
                }
            }

            updateBookmarkBadge() {
                const badge = document.getElementById('nav-bookmark-count');
                if (badge) badge.textContent = this.bookmarks.length;
            }

            // Custom Modal System
            showModal({ title, message, iconClass = 'fa-circle-info', iconBg = 'bg-indigo-100 text-indigo-600', confirmText = 'নিশ্চিত করুন', cancelText = 'বাতিল', showCancel = true, onConfirm }) {
                const modal = document.getElementById('custom-modal');
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-message').textContent = message;
                
                const iconEl = document.getElementById('modal-icon');
                iconEl.className = `w-10 h-10 rounded-full flex items-center justify-center text-lg ${iconBg}`;
                iconEl.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;

                const cancelBtn = document.getElementById('modal-cancel-btn');
                const confirmBtn = document.getElementById('modal-confirm-btn');

                cancelBtn.textContent = cancelText;
                confirmBtn.textContent = confirmText;
                cancelBtn.style.display = showCancel ? 'inline-block' : 'none';

                modal.classList.remove('hidden');
                modal.classList.add('flex');

                const cleanup = () => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                    cancelBtn.onclick = null;
                    confirmBtn.onclick = null;
                };

                cancelBtn.onclick = cleanup;
                confirmBtn.onclick = () => {
                    cleanup();
                    if (onConfirm) onConfirm();
                };
            }

            // Navigation
            goHome() {
                if (this.currentView === 'quiz') {
                    this.showModal({
                        title: 'পরীক্ষা ত্যাগ করবেন?',
                        message: 'আপনি কি নিশ্চিত যে বর্তমান পরীক্ষাটি মাঝপথে বন্ধ করে হোম পেজে ফিরে যেতে চান? আপনার বর্তমান উত্তরগুলি সংরক্ষিত হবে না।',
                        iconClass: 'fa-triangle-exclamation',
                        iconBg: 'bg-amber-100 text-amber-600',
                        confirmText: 'হ্যাঁ, ফিরে যান',
                        cancelText: 'পরীক্ষা চালিয়ে যান',
                        onConfirm: () => {
                            this.stopTimer();
                            this.renderHome();
                        }
                    });
                    return;
                }
                this.stopTimer();
                this.renderHome();
            }

            toggleNavHomeBtn(show) {
                const btn = document.getElementById('nav-home-btn');
                if (show) {
                    btn.classList.remove('hidden');
                    btn.classList.add('flex');
                } else {
                    btn.classList.add('hidden');
                    btn.classList.remove('flex');
                }
            }

            // Stats Calculation
            getOverallStats() {
                const keys = Object.keys(this.progress);
                const completedSets = keys.length;
                let totalScore = 0;
                keys.forEach(k => {
                    totalScore += this.progress[k].score;
                });
                const avgPercentage = completedSets > 0 ? Math.round((totalScore / (completedSets * 20)) * 100) : 0;
                const totalPracticed = completedSets * 20;
                return { completedSets, avgPercentage, totalPracticed };
            }

            // ==========================================
            // VIEW 1: HOME DASHBOARD
            // ==========================================

                const stats = this.getOverallStats();

                        rose: 'from-rose-600 to-rose-800 text-rose-600 bg-rose-50 border-rose-200',
                        purple: 'from-purple-600 to-purple-800 text-purple-600 bg-purple-50 border-purple-200',
                        teal: 'from-teal-600 to-teal-800 text-teal-600 bg-teal-50 border-teal-200'

                    const gradClass = theme.split(' ').slice(0, 2).join(' ');
                    const badgeClass = theme.split(' ').slice(2).join(' ');

                    return `
                        <div onclick="app.openChapter(${ch.id})" class="group bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl hover:border-indigo-300 transition-all duration-300 cursor-pointer overflow-hidden flex flex-col justify-between fade-in">
                            <div>
                                <div class="p-5 pb-4">

                                            ${ch.number}
                                        </span>
                                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${gradClass} text-white flex items-center justify-center shadow-sm group-hover:scale-110 transition-transform">
                                            <i class="fa-solid ${ch.icon}"></i>
                                        </div>
                                    </div>
                                    <h3 class="text-lg font-bold text-slate-900 group-hover:text-indigo-700 transition-colors mb-1.5 leading-snug">

                                        ${ch.subtitle}

                                <div class="flex items-center justify-between text-xs font-semibold text-slate-600 mb-2">
                                    <span>৩টি সেট • ৬০টি প্রশ্ন</span>
                                    <span class="${completedCount === 3 ? 'text-emerald-600' : 'text-indigo-600'}">${completedCount}/৩ সম্পন্ন</span>
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    ${[1, 2, 3].map(sNum => {

                                <i class="fa-solid fa-play"></i>
                                <span>${saved ? 'পুনরায় পরীক্ষা শুরু করুন' : 'পরীক্ষা শুরু করুন'}</span>

            // ==========================================
            // VIEW 3: INTERACTIVE QUIZ SCREEN
            // ==========================================
            startQuiz(chapterId, setId) {
                const chapter = HISTORY_DATA.find(c => c.id === chapterId);
                const set = chapter.sets.find(s => s.setId === setId);
                
                this.activeChapter = chapter;
                this.activeSet = set;
                this.currentView = 'quiz';
                this.currentQIndex = 0;
                this.userAnswers = new Array(set.questions.length).fill(null);
                this.markedForReview = new Array(set.questions.length).fill(false);
                this.secondsRemaining = 20 * 60; // 20 mins
                this.timeSpent = 0;

                this.toggleNavHomeBtn(true);
                this.startTimer();
                this.renderQuizQuestion();
            }

            startTimer() {
                this.stopTimer();
                this.timerInterval = setInterval(() => {
                    this.secondsRemaining--;
                    this.timeSpent++;
                    
                    const timerEl = document.getElementById('quiz-timer');
                    if (timerEl) {
                        const mins = Math.floor(this.secondsRemaining / 60);
                        const secs = this.secondsRemaining % 60;
                        timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                        if (this.secondsRemaining <= 120) {
                            timerEl.parentElement.classList.add('bg-rose-100', 'text-rose-700', 'border-rose-300');
                        }
                    }

                    if (this.secondsRemaining <= 0) {
                        this.stopTimer();
                        this.finishQuiz();
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            isBookmarked(chId, sId, qIdx) {
                const uid = `${chId}_${sId}_${qIdx}`;
                return this.bookmarks.includes(uid);
            }

            toggleBookmark(chId, sId, qIdx) {
                const uid = `${chId}_${sId}_${qIdx}`;
                if (this.bookmarks.includes(uid)) {
                    this.bookmarks = this.bookmarks.filter(id => id !== uid);
                } else {
                    this.bookmarks.push(uid);
                }
                this.saveBookmarks();
                if (this.currentView === 'quiz') {
                    this.renderQuizQuestion();
                } else if (this.currentView === 'bookmarks') {
                    this.openBookmarksView();
                }
            }

            selectOption(optIndex) {
                // In instant feedback mode, prevent changing answer once selected
                if (this.instantFeedback && this.userAnswers[this.currentQIndex] !== null) {
                    return;
                }
                this.userAnswers[this.currentQIndex] = optIndex;
                this.renderQuizQuestion();
            }

            toggleMarkReview() {
                this.markedForReview[this.currentQIndex] = !this.markedForReview[this.currentQIndex];
                this.renderQuizQuestion();
            }

            jumpToQuestion(idx) {
                if (idx >= 0 && idx < this.activeSet.questions.length) {
                    this.currentQIndex = idx;
                    this.renderQuizQuestion();
                }
            }

            renderQuizQuestion() {
                const qObj = this.activeSet.questions[this.currentQIndex];
                const selected = this.userAnswers[this.currentQIndex];
                const isMarked = this.markedForReview[this.currentQIndex];
                const bookmarked = this.isBookmarked(this.activeChapter.id, this.activeSet.setId, this.currentQIndex);
                const totalQ = this.activeSet.questions.length;
                const answeredCount = this.userAnswers.filter(a => a !== null).length;

                const mins = Math.floor(this.secondsRemaining / 60);
                const secs = this.secondsRemaining % 60;
                const formattedTime = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                const optionLabels = ['ক', 'খ', 'গ', 'ঘ'];

                const optionsHtml = qObj.o.map((optText, idx) => {
                    let cardStyle = 'border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50/40 text-slate-800';
                    let badgeStyle = 'bg-slate-100 text-slate-700 border-slate-200';
                    let statusIcon = '';

                    if (selected !== null) {
                        if (this.instantFeedback) {
                            if (idx === qObj.a) {
                                cardStyle = 'border-emerald-500 bg-emerald-50 text-emerald-950 ring-2 ring-emerald-500/20';
                                badgeStyle = 'bg-emerald-600 text-white border-emerald-600';
                                statusIcon = '<i class="fa-solid fa-circle-check text-emerald-600 text-xl"></i>';
                            } else if (idx === selected && idx !== qObj.a) {
                                cardStyle = 'border-rose-500 bg-rose-50 text-rose-950 ring-2 ring-rose-500/20';
                                badgeStyle = 'bg-rose-600 text-white border-rose-600';
                                statusIcon = '<i class="fa-solid fa-circle-xmark text-rose-600 text-xl"></i>';
                            } else {
                                cardStyle = 'border-slate-200 bg-slate-50/60 text-slate-400 opacity-75';
                            }
                        } else {
                            if (idx === selected) {
                                cardStyle = 'border-indigo-600 bg-indigo-50 text-indigo-950 ring-2 ring-indigo-600/20';
                                badgeStyle = 'bg-indigo-600 text-white border-indigo-600';
                                statusIcon = '<i class="fa-solid fa-check-circle text-indigo-600 text-lg"></i>';
                            }
                        }
                    }

                    return `
                        <button onclick="app.selectOption(${idx})" class="option-card w-full text-left p-4 rounded-2xl border-2 ${cardStyle} flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3.5">
                                <span class="w-9 h-9 rounded-xl border ${badgeStyle} flex items-center justify-center font-bold text-base shrink-0">
                                    ${optionLabels[idx]}
                                </span>
                                <span class="text-base sm:text-lg font-medium leading-snug">${optText}</span>
                            </div>
                            ${statusIcon}
                        </button>
                    `;
                }).join('');

                // Question Palette Buttons
                const paletteHtml = this.activeSet.questions.map((_, idx) => {
                    const ans = this.userAnswers[idx];
                    const rev = this.markedForReview[idx];
                    let btnClass = 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200';

                    if (ans !== null) {
                        if (this.instantFeedback) {
                            btnClass = ans === this.activeSet.questions[idx].a 
                                ? 'bg-emerald-500 text-white border-emerald-600' 
                                : 'bg-rose-500 text-white border-rose-600';
                        } else {
                            btnClass = 'bg-indigo-600 text-white border-indigo-700';
                        }
                    }
                    if (rev) {
                        btnClass = 'bg-amber-400 text-slate-900 border-amber-500 font-bold';
                    }
                    if (idx === this.currentQIndex) {
                        btnClass += ' ring-2 ring-offset-2 ring-indigo-600 font-bold';
                    }

                    return `
                        <button onclick="app.jumpToQuestion(${idx})" class="h-9 rounded-lg border text-sm font-semibold transition flex items-center justify-center ${btnClass}">
                            ${idx + 1}
                        </button>
                    `;
                }).join('');

                this.container.innerHTML = `
                    <div class="fade-in max-w-6xl mx-auto space-y-5">
                        <!-- Top Quiz Status Bar -->
                        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-wrap items-center justify-between gap-3">
                            <div>
                                <div class="text-xs font-bold text-indigo-600">${this.activeChapter.number} • ${this.activeSet.name}</div>
                                <h2 class="text-base sm:text-lg font-bold text-slate-900 truncate max-w-md">${this.activeChapter.title}</h2>
                            </div>

                            <div class="flex items-center gap-3">
                                <div class="px-3.5 py-1.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-800 font-bold text-sm flex items-center gap-2">
                                    <i class="fa-regular fa-clock text-indigo-600"></i>
                                    <span id="quiz-timer">${formattedTime}</span>
                                </div>
                                <button onclick="app.confirmSubmitQuiz()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow transition">
                                    <i class="fa-solid fa-paper-plane mr-1"></i> জমা দিন (${answeredCount}/${totalQ})
                                </button>
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${((this.currentQIndex + 1) / totalQ) * 100}%"></div>
                        </div>

                        <!-- Main Quiz Grid: Left Question Area, Right Palette -->
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <!-- Question Card -->
                            <div class="lg:col-span-2 bg-white rounded-3xl border border-slate-200 p-5 sm:p-7 shadow-sm flex flex-col justify-between space-y-6">
                                <div>
                                    <div class="flex items-center justify-between gap-2 mb-4">
                                        <span class="px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 text-sm font-bold border border-indigo-100">
                                            প্রশ্ন ${this.currentQIndex + 1} / ${totalQ}
                                        </span>
                                        <div class="flex items-center gap-2">
                                            <button onclick="app.toggleMarkReview()" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${isMarked ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">
                                                <i class="fa-solid fa-flag mr-1"></i> ${isMarked ? 'রিভিউ চিহ্নিত' : 'রিভিউ রাখুন'}
                                            </button>
                                            <button onclick="app.toggleBookmark(${this.activeChapter.id}, ${this.activeSet.setId}, ${this.currentQIndex})" class="p-2 rounded-xl border transition ${bookmarked ? 'bg-amber-50 text-amber-500 border-amber-300' : 'bg-slate-50 text-slate-400 border-slate-200 hover:text-amber-500'}" title="গুরুত্বপূর্ণ প্রশ্ন বুকমার্ক করুন">
                                                <i class="fa-${bookmarked ? 'solid' : 'regular'} fa-bookmark"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <h3 class="text-xl sm:text-2xl font-bold text-slate-900 leading-relaxed mb-6">
                                        ${qObj.q}
                                    </h3>

                                    <div class="space-y-3">
                                        ${optionsHtml}
                                    </div>

                                    <!-- Instant Explanation Box -->
                                    ${(this.instantFeedback && selected !== null) ? `
                                        <div class="mt-6 p-4 rounded-2xl ${selected === qObj.a ? 'bg-emerald-50 border border-emerald-200' : 'bg-amber-50 border border-amber-200'} fade-in">
                                            <div class="flex items-center gap-2 font-bold text-sm mb-1 ${selected === qObj.a ? 'text-emerald-800' : 'text-amber-900'}">
                                                <i class="fa-solid ${selected === qObj.a ? 'fa-circle-check text-emerald-600' : 'fa-lightbulb text-amber-600'}"></i>
                                                <span>${selected === qObj.a ? 'সঠিক উত্তর!' : `সঠিক উত্তর: (${optionLabels[qObj.a]}) ${qObj.o[qObj.a]}`}</span>
                                            </div>
                                            <p class="text-sm text-slate-700 leading-relaxed">${qObj.e}</p>
                                        </div>
                                    ` : ''}
                                </div>

                                <!-- Bottom Navigation Buttons -->
                                <div class="pt-4 border-t border-slate-100 flex items-center justify-between gap-3">
                                    <button onclick="app.jumpToQuestion(${this.currentQIndex - 1})" ${this.currentQIndex === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50 disabled:opacity-40 disabled:pointer-events-none transition flex items-center gap-2">
                                        <i class="fa-solid fa-chevron-left"></i>
                                        <span>পূর্ববর্তী</span>
                                    </button>

                                    ${this.currentQIndex < totalQ - 1 ? `
                                        <button onclick="app.jumpToQuestion(${this.currentQIndex + 1})" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow transition flex items-center gap-2">
                                            <span>পরবর্তী প্রশ্ন</span>
                                            <i class="fa-solid fa-chevron-right"></i>
                                        </button>
                                    ` : `
                                        <button onclick="app.confirmSubmitQuiz()" class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow transition flex items-center gap-2">
                                            <span>পরীক্ষা শেষ করুন</span>
                                            <i class="fa-solid fa-check"></i>
                                        </button>
                                    `}
                                </div>
                            </div>

                            <!-- Question Palette Sidebar -->
                            <div class="bg-white rounded-3xl border border-slate-200 p-5 shadow-sm h-fit space-y-4">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <h4 class="font-bold text-slate-900">প্রশ্ন তালিকা (১-২০)</h4>
                                    <span class="text-xs font-semibold text-slate-500">${answeredCount}টি উত্তরিত</span>
                                </div>

                                <div class="grid grid-cols-5 gap-2">
                                    ${paletteHtml}
                                </div>

                                <div class="pt-3 border-t border-slate-100 grid grid-cols-2 gap-2 text-xs text-slate-600">
                                    <div class="flex items-center gap-1.5">
                                        <span class="w-3 h-3 rounded bg-indigo-600 inline-block"></span> উত্তর দেওয়া হয়েছে
                                    </div>
                                    <div class="flex items-center gap-1.5">
                                        <span class="w-3 h-3 rounded bg-slate-200 inline-block"></span> বাকি আছে
                                    </div>
                                    <div class="flex items-center gap-1.5">
                                        <span class="w-3 h-3 rounded bg-amber-400 inline-block"></span> রিভিউ চিহ্নিত
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            confirmSubmitQuiz() {
                const unanswered = this.userAnswers.filter(a => a === null).length;
                const msg = unanswered > 0 
                    ? `আপনি এখনো ${unanswered}টি প্রশ্নের উত্তর দেননি। তবুও কি পরীক্ষা জমা দিতে চান?`
                    : 'আপনি সবকটি প্রশ্নের উত্তর দিয়েছেন। পরীক্ষা জমা দিয়ে ফলাফল দেখতে চান?';

                this.showModal({
                    title: 'পরীক্ষা জমা দেবেন?',
                    message: msg,
                    iconClass: 'fa-clipboard-check',
                    iconBg: 'bg-emerald-100 text-emerald-600',
                    confirmText: 'হ্যাঁ, জমা দিন',
                    cancelText: 'ফিরে যান',
                    onConfirm: () => this.finishQuiz()
                });
            }

            // ==========================================
            // VIEW 4: RESULT & ANALYSIS SCREEN
            // ==========================================
            finishQuiz() {
                this.stopTimer();
                this.currentView = 'result';

                const questions = this.activeSet.questions;
                let correct = 0;
                let wrong = 0;
                let skipped = 0;

                questions.forEach((q, idx) => {
                    const ans = this.userAnswers[idx];
                    if (ans === null) skipped++;
                    else if (ans === q.a) correct++;
                    else wrong++;
                });

                const percentage = Math.round((correct / questions.length) * 100);
                
                // Save best score in localStorage
                const key = `${this.activeChapter.id}_${this.activeSet.setId}`;
                const prevBest = this.progress[key] ? this.progress[key].score : -1;
                if (correct >= prevBest) {
                    this.progress[key] = {
                        score: correct,
                        date: new Date().toLocaleDateString('bn-IN')
                    };
                    this.saveProgress();
                }

                // Grade / Remark
                let remark = '';
                let badgeColor = '';
                if (percentage >= 90) {
                    remark = 'অসাধারণ! চমৎকার প্রস্তুতি (A+)';
                    badgeColor = 'text-emerald-600 bg-emerald-50 border-emerald-200';
                } else if (percentage >= 75) {
                    remark = 'খুব ভালো ফলাফল! (A)';
                    badgeColor = 'text-indigo-600 bg-indigo-50 border-indigo-200';
                } else if (percentage >= 50) {
                    remark = 'ভালো চেষ্টা, আরও অনুশীলন প্রয়োজন (B)';
                    badgeColor = 'text-amber-600 bg-amber-50 border-amber-200';
                } else {
                    remark = 'অধ্যায়টি আরেকবার ভালো করে পড়ো (C)';
                    badgeColor = 'text-rose-600 bg-rose-50 border-rose-200';
                }

                const minsTaken = Math.floor(this.timeSpent / 60);
                const secsTaken = this.timeSpent % 60;
                const optionLabels = ['ক', 'খ', 'গ', 'ঘ'];

                // Review List HTML
                const reviewHtml = questions.map((q, idx) => {
                    const userAns = this.userAnswers[idx];
                    const isCorrect = userAns === q.a;
                    const isSkipped = userAns === null;
                    const bookmarked = this.isBookmarked(this.activeChapter.id, this.activeSet.setId, idx);

                    let statusBadge = isSkipped 
                        ? '<span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs font-bold">উত্তর দেওয়া হয়নি</span>'
                        : (isCorrect 
                            ? '<span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold"><i class="fa-solid fa-check mr-1"></i>সঠিক</span>'
                            : '<span class="px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700 text-xs font-bold"><i class="fa-solid fa-xmark mr-1"></i>ভুল</span>');

                    return `
                        <div class="bg-white rounded-2xl border ${isSkipped ? 'border-slate-200' : (isCorrect ? 'border-emerald-200' : 'border-rose-200')} p-5 shadow-sm">
                            <div class="flex items-start justify-between gap-3 mb-3">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-indigo-700 text-sm">প্রশ্ন ${idx + 1}.</span>
                                    ${statusBadge}
                                </div>
                                <button onclick="app.toggleBookmark(${this.activeChapter.id}, ${this.activeSet.setId}, ${idx}); this.querySelector('i').className = app.isBookmarked(${this.activeChapter.id}, ${this.activeSet.setId}, ${idx}) ? 'fa-solid fa-bookmark text-amber-500' : 'fa-regular fa-bookmark text-slate-400'" class="text-base p-1" title="বুকমার্ক">
                                    <i class="fa-${bookmarked ? 'solid text-amber-500' : 'regular text-slate-400'} fa-bookmark"></i>
                                </button>
                            </div>

                            <p class="font-bold text-slate-900 text-base sm:text-lg mb-4">${q.q}</p>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-4">
                                ${q.o.map((opt, oIdx) => {
                                    let optClass = 'bg-slate-50 border-slate-200 text-slate-700';
                                    if (oIdx === q.a) {
                                        optClass = 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold';
                                    } else if (oIdx === userAns && userAns !== q.a) {
                                        optClass = 'bg-rose-50 border-rose-500 text-rose-900 font-bold';
                                    }
                                    return `
                                        <div class="p-3 rounded-xl border ${optClass} text-sm flex items-center justify-between">
                                            <span><strong>(${optionLabels[oIdx]})</strong> ${opt}</span>
                                            ${oIdx === q.a ? '<i class="fa-solid fa-circle-check text-emerald-600"></i>' : ''}
                                            ${(oIdx === userAns && userAns !== q.a) ? '<i class="fa-solid fa-circle-xmark text-rose-600"></i>' : ''}
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <div class="p-3.5 rounded-xl bg-indigo-50/60 border border-indigo-100 text-sm text-slate-700">
                                <strong class="text-indigo-900"><i class="fa-solid fa-circle-info mr-1"></i>ব্যাখ্যা:</strong> ${q.e}
                            </div>
                        </div>
                    `;
                }).join('');

                const nextSetId = this.activeSet.setId < 3 ? this.activeSet.setId + 1 : null;

                this.container.innerHTML = `
                    <div class="fade-in max-w-4xl mx-auto space-y-6">
                        <!-- Result Score Card -->
                        <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-md text-center">
                            <div class="inline-block px-4 py-1.5 rounded-full border text-sm font-bold mb-4 ${badgeColor}">
                                ${remark}
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-1">${this.activeChapter.title}</h2>
                            <p class="text-slate-500 font-medium mb-6">${this.activeSet.name}</p>

                            <!-- Circular Score Display -->
                            <div class="w-36 h-36 mx-auto rounded-full bg-gradient-to-br from-indigo-600 to-indigo-900 text-white flex flex-col items-center justify-center shadow-xl mb-6 ring-8 ring-indigo-50">
                                <div class="text-4xl font-extrabold">${correct}<span class="text-xl font-normal text-indigo-200">/২০</span></div>
                                <div class="text-sm font-bold text-amber-300 mt-1">${percentage}% নম্বর</div>
                            </div>

                            <!-- Stats Breakdown -->
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-2xl mx-auto mb-8">
                                <div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-100">
                                    <div class="text-xs font-bold text-emerald-700">সঠিক উত্তর</div>
                                    <div class="text-2xl font-extrabold text-emerald-600">${correct}</div>
                                </div>
                                <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-100">
                                    <div class="text-xs font-bold text-rose-700">ভুল উত্তর</div>
                                    <div class="text-2xl font-extrabold text-rose-600">${wrong}</div>
                                </div>
                                <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                                    <div class="text-xs font-bold text-slate-600">উত্তরহীন</div>
                                    <div class="text-2xl font-extrabold text-slate-700">${skipped}</div>
                                </div>
                                <div class="p-3.5 rounded-2xl bg-indigo-50 border border-indigo-100">
                                    <div class="text-xs font-bold text-indigo-700">ব্যয়িত সময়</div>
                                    <div class="text-xl font-extrabold text-indigo-700 mt-0.5">${minsTaken}মি ${secsTaken}সে</div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="flex flex-wrap items-center justify-center gap-3">
                                <button onclick="app.startQuiz(${this.activeChapter.id}, ${this.activeSet.setId})" class="px-5 py-3 rounded-xl border-2 border-indigo-600 text-indigo-700 hover:bg-indigo-50 font-bold text-sm transition flex items-center gap-2">
                                    <i class="fa-solid fa-rotate-right"></i>
                                    <span>পুনরায় পরীক্ষা দিন</span>
                                </button>
                                ${nextSetId ? `
                                    <button onclick="app.startQuiz(${this.activeChapter.id}, ${nextSetId})" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition flex items-center gap-2">
                                        <span>পরবর্তী সেট (সেট ${nextSetId})</span>
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </button>
                                ` : `
                                    <button onclick="app.renderHome()" class="px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-md transition flex items-center gap-2">
                                        <span>অন্য অধ্যায় নির্বাচন করুন</span>
                                        <i class="fa-solid fa-house"></i>
                                    </button>
                                `}
                            </div>
                        </div>

                        <!-- Detailed Answer Review -->
                        <div class="space-y-4">
                            <h3 class="text-xl font-bold text-slate-900 px-1">বিস্তারিত উত্তর ও ব্যাখ্যা পর্যালোচনা</h3>
                            ${reviewHtml}
                        </div>
                    </div>
                `;
            }

            // ==========================================
            // VIEW 5: BOOKMARKS VIEW
            // ==========================================
            openBookmarksView() {
                if (this.currentView === 'quiz') {
                    this.showModal({
                        title: 'পরীক্ষা ত্যাগ করবেন?',
                        message: 'বুকমার্ক পাতায় গেলে বর্তমান পরীক্ষাটি বন্ধ হয়ে যাবে। আপনি কি যেতে চান?',
                        confirmText: 'হ্যাঁ, যান',
                        onConfirm: () => {
                            this.stopTimer();
                            this.renderBookmarks();
                        }
                    });
                    return;
                }
                this.renderBookmarks();
            }

            renderBookmarks() {
                this.currentView = 'bookmarks';
                this.toggleNavHomeBtn(true);
                const optionLabels = ['ক', 'খ', 'গ', 'ঘ'];

                let listHtml = '';
                if (this.bookmarks.length === 0) {
                    listHtml = `
                        <div class="bg-white rounded-3xl border border-slate-200 p-12 text-center">
                            <div class="w-16 h-16 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-2xl mx-auto mb-4">
                                <i class="fa-regular fa-bookmark"></i>
                            </div>
                            <h3 class="text-xl font-bold text-slate-900 mb-2">কোনো প্রশ্ন বুকমার্ক করা নেই</h3>
                            <p class="text-slate-500 max-w-md mx-auto mb-6">অনুশীলন করার সময় যেকোনো কঠিন বা গুরুত্বপূর্ণ প্রশ্নের ডানদিকের বুকমার্ক আইকনে ক্লিক করে এখানে সংরক্ষণ করতে পারবেন।</p>
                            <button onclick="app.renderHome()" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 transition">
                                অনুশীলন শুরু করুন
                            </button>
                        </div>
                    `;
                } else {
                    listHtml = this.bookmarks.map(uid => {
                        const [chId, sId, qIdx] = uid.split('_').map(Number);
                        const ch = HISTORY_DATA.find(c => c.id === chId);
                        const set = ch?.sets.find(s => s.setId === sId);
                        const q = set?.questions[qIdx];
                        if (!q) return '';

                        return `
                            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                                <div class="flex items-center justify-between gap-2 mb-2">
                                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">
                                        ${ch.number}: ${ch.title} • সেট ${sId}
                                    </span>
                                    <button onclick="app.toggleBookmark(${chId}, ${sId}, ${qIdx})" class="text-rose-500 hover:text-rose-700 text-xs font-bold px-2.5 py-1 rounded-lg bg-rose-50">
                                        <i class="fa-solid fa-trash-can mr-1"></i> সরান
                                    </button>
                                </div>
                                <h4 class="text-lg font-bold text-slate-900 mb-3">${q.q}</h4>
                                <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm font-bold mb-2">
                                    সঠিক উত্তর: (${optionLabels[q.a]}) ${q.o[q.a]}
                                </div>
                                <p class="text-sm text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <strong>ব্যাখ্যা:</strong> ${q.e}
                                </p>
                            </div>
                        `;
                    }).join('');
                }

                this.container.innerHTML = `
                    <div class="fade-in max-w-4xl mx-auto space-y-5">
                        <div class="flex items-center justify-between">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-900">গুরুত্বপূর্ণ বুকমার্ক প্রশ্নাবলী (${this.bookmarks.length})</h2>
                                <p class="text-sm text-slate-500">পরীক্ষার আগে দ্রুত রিভিশনের জন্য সংরক্ষিত প্রশ্নসমূহ</p>
                            </div>
                        </div>
                        <div class="space-y-4">
                            ${listHtml}
                        </div>
                    </div>
                `;
            }

            // ==========================================
            // VIEW 6: SEARCH & QUICK REVISION
            // ==========================================
            openSearchView() {
                if (this.currentView === 'quiz') {
                    this.showModal({
                        title: 'পরীক্ষা ত্যাগ করবেন?',
                        message: 'সার্চ পাতায় গেলে বর্তমান পরীক্ষাটি বন্ধ হয়ে যাবে। আপনি কি যেতে চান?',
                        confirmText: 'হ্যাঁ, যান',
                        onConfirm: () => {
                            this.stopTimer();
                            this.renderSearch();
                        }
                    });
                    return;
                }
                this.renderSearch();
            }

            renderSearch() {
                this.currentView = 'search';
                this.toggleNavHomeBtn(true);

                this.container.innerHTML = `
                    <div class="fade-in max-w-4xl mx-auto space-y-5">
                        <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm">
                            <h2 class="text-2xl font-bold text-slate-900 mb-2">৪২০টি প্রশ্ন থেকে খুঁজুন (দ্রুত রিভিশন)</h2>
                            <p class="text-sm text-slate-500 mb-4">যেকোনো ঐতিহাসিক ঘটনা, সাল, ব্যক্তির নাম বা শব্দ লিখে সার্চ করুন (যেমন: বাস্তিল, নেপোলিয়ন, বিসমার্ক, ভার্সাই, লেনিন)</p>
                            <div class="relative">
                                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="search-input" oninput="app.handleSearch(this.value)" placeholder="এখানে বাংলায় লিখুন..." class="w-full pl-11 pr-4 py-3.5 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none text-base font-medium">
                            </div>
                        </div>

                        <div id="search-results" class="space-y-4">
                            <div class="text-center py-10 text-slate-400">
                                <i class="fa-solid fa-book-open text-4xl mb-2"></i>
                                <p>সার্চ বক্সে লিখলে তৎক্ষণাৎ উত্তর ও ব্যাখ্যাসহ প্রশ্ন দেখা যাবে</p>
                            </div>
                        </div>
                    </div>
                `;
                setTimeout(() => document.getElementById('search-input')?.focus(), 50);
            }

            handleSearch(query) {
                const resultsContainer = document.getElementById('search-results');
                const qText = query.trim().toLowerCase();
                const optionLabels = ['ক', 'খ', 'গ', 'ঘ'];

                if (qText.length < 2) {
                    resultsContainer.innerHTML = `
                        <div class="text-center py-10 text-slate-400">
                            <p>অন্তত ২টি অক্ষর লিখে অনুসন্ধান করুন...</p>
                        </div>
                    `;
                    return;
                }

                const matches = [];
                HISTORY_DATA.forEach(ch => {
                    ch.sets.forEach(set => {
                        set.questions.forEach((item, idx) => {
                            if (
                                item.q.toLowerCase().includes(qText) ||
                                item.e.toLowerCase().includes(qText) ||
                                item.o.some(opt => opt.toLowerCase().includes(qText))
                            ) {
                                matches.push({ ch, set, item, idx });
                            }
                        });
                    });
                });

                if (matches.length === 0) {
                    resultsContainer.innerHTML = `
                        <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-500">
                            "${query}" সম্পর্কিত কোনো প্রশ্ন পাওয়া যায়নি। অন্য শব্দ দিয়ে চেষ্টা করুন।
                        </div>
                    `;
                    return;
                }

                resultsContainer.innerHTML = `
                    <div class="text-sm font-bold text-slate-600 px-1">মোট ${matches.length}টি প্রাসঙ্গিক প্রশ্ন পাওয়া গেছে:</div>
                    ${matches.slice(0, 40).map(m => `
                        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                            <div class="text-xs font-bold text-indigo-600 mb-1.5">${m.ch.number}: ${m.ch.title} • সেট ${m.set.setId}</div>
                            <h4 class="text-base sm:text-lg font-bold text-slate-900 mb-3">${m.item.q}</h4>
                            <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm font-bold mb-2">
                                সঠিক উত্তর: (${optionLabels[m.item.a]}) ${m.item.o[m.item.a]}
                            </div>
                            <p class="text-sm text-slate-600"><strong>ব্যাখ্যা:</strong> ${m.item.e}</p>
                        </div>
                    `).join('')}
                `;
            }
        }

        // Initialize App on Window Load
        let app;
        window.onload = function() {
            app = new HistoryQuizApp();
        };
    </script>

<style>
/* Mobile screen improvement */
@media (max-width: 600px) {
  #app-container {
    padding: 10px !important;
  }

  #app-container button {
    min-height: 42px;
  }

  #app-container h2 {

<script>
(function () {
  const bengaliDigits = "০১২৩৪৫৬৭৮৯";
  const englishDigits = "0123456789";

  function convertDigits() {
    const walker = document.createTreeWalker(
      document.body,
      NodeFilter.SHOW_TEXT
    );

    let node;
    while (node = walker.nextNode()) {
      if (node.parentElement.closest("script,style")) continue;

      const converted = node.nodeValue.replace(
        /[০-৯]/g,
        digit => englishDigits[bengaliDigits.indexOf(digit)]
      );

      if (converted !== node.nodeValue) {
        node.nodeValue = converted;
      }
    }
  }

  convertDigits();

  const observer = new MutationObserver(convertDigits);
  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();
</script>
